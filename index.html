<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE OMR Sheet</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .no-print { display: none; }
            .print-page { border: none; box-shadow: none; margin: 0; padding: 10mm; width: 210mm; height: 297mm; position: relative; }
        }
        .bubble { width: 18px; height: 18px; border: 1px solid #666; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: normal; color: #333; }
        .anchor { width: 24px; height: 24px; background: black; position: absolute; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <!-- Action panel hidden when routing to hard copy printing -->
    <div class="no-print bg-white rounded-2xl shadow-xl p-6 max-w-md w-full text-center border border-gray-200 mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">JEE OMR Web Portal</h1>
        <p class="text-gray-600 text-sm mb-4">Pure HTML version. Tapping below calls your system's hardware print driver layout directly.</p>
        <button onclick="window.print()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md active:scale-95 cursor-pointer">
            Print Sheet Now
        </button>
    </div>

    <!-- Printable A4 Workspace Area -->
    <div class="print-page bg-white w-[210mm] h-[297mm] p-[12mm] relative shadow-2xl border border-gray-300 flex flex-col justify-between box-border overflow-hidden select-none">
        
        <!-- Target Calibrators for OpenCV Scanning Module -->
        <div class="anchor top-[10mm] left-[10mm]"></div>
        <div class="anchor top-[10mm] right-[10mm]"></div>
        <div class="anchor bottom-[10mm] left-[10mm]"></div>
        <div class="anchor bottom-[10mm] right-[10mm]"></div>

        <!-- Main Structure Header -->
        <div class="text-center mt-2">
            <h2 class="text-xl font-black tracking-wide text-black">JEE MAIN MOCK EXAMINATION</h2>
            <p class="text-[11px] text-gray-700 font-medium mt-0.5">Shade bubbles completely using blue/black ink. Keep tracking marks pristine.</p>
        </div>

        <!-- Student Data Registration Section -->
        <div class="grid grid-cols-12 gap-4 my-4 items-start">
            <!-- Roll Number Tracking Matrix -->
            <div class="col-span-5">
                <span class="text-[10px] font-bold block mb-1">ROLL NUMBER</span>
                <div class="flex gap-1 mb-1.5">
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                </div>
                <div class="space-y-0.5">
                    <!-- Ten digit structural tracking loop rows -->
                    <script>
                        for(let r=0; r<=9; r++){
                            document.write(`<div class='flex gap-1'>`);
                            for(let c=0; c<7; c++) {
                                document.write(`<div class='w-5 h-[17px] border border-gray-400 rounded-full flex items-center justify-center text-[9px]'>${r}</div>`);
                            }
                            document.write(`</div>`);
                        }
                    </script>
                </div>
            </div>

            <!-- Test Configuration Tracking Matrix -->
            <div class="col-span-3">
                <span class="text-[10px] font-bold block mb-1">TEST ID</span>
                <div class="flex gap-1 mb-1.5">
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                    <div class="w-5 h-5 border border-black"></div>
                </div>
                <div class="space-y-0.5">
                    <script>
                        for(let r=0; r<=9; r++){
                            document.write(`<div class='flex gap-1'>`);
                            for(let c=0; c<4; c++) {
                                document.write(`<div class='w-5 h-[17px] border border-gray-400 rounded-full flex items-center justify-center text-[9px]'>${r}</div>`);
                            }
                            document.write(`</div>`);
                        }
                    </script>
                </div>
            </div>

            <!-- Validation Signature Panels -->
            <div class="col-span-4 flex flex-col gap-3 justify-end h-full pt-4">
                <div>
                    <span class="text-[9px] font-bold block mb-0.5">CANDIDATE SIGNATURE</span>
                    <div class="w-full h-12 border border-black rounded"></div>
                </div>
                <div>
                    <span class="text-[9px] font-bold block mb-0.5">INVIGILATOR SIGNATURE</span>
                    <div class="w-full h-12 border border-black rounded"></div>
                </div>
            </div>
        </div>

        <hr class="border-t border-black my-1" />

        <!-- 90 Question Distribution Workspace -->
        <div class="grid grid-cols-3 gap-6 flex-grow">
            <!-- Row generation macro mapped dynamically -->
            <script>
                const sections = ["PHYSICS (1-30)", "CHEMISTRY (31-60)", "MATHEMATICS (61-90)"];
                const opts = ['A', 'B', 'C', 'D'];
                
                for(let col=0; col<3; col++) {
                    document.write(`<div class="flex flex-col justify-between pb-2">
                        <div class="text-center font-bold text-[11px] border-b border-black pb-0.5 mb-1.5">${sections[col]}</div>`);
                    
                    for(let r=0; r<30; r++) {
                        let qNum = (col * 30) + r + 1;
                        document.write(`<div class="flex items-center justify-between h-[18px]">
                            <span class="text-[11px] font-bold w-5">${String(qNum).padStart(2, '0')}</span>`);
                        
                        opts.forEach(o => {
                            document.write(`<div class="bubble">${o}</div>`);
                        });
                        document.write(`</div>`);
                    }
                    document.write(`</div>`);
                }
            </script>
        </div>
    </div>

</body>
</html>
